<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <clipPath id="tile"><rect width="48" height="48" rx="4"/></clipPath>
  </defs>
  <rect width="48" height="48" rx="4" fill="#0E6E6E"/>
  <g clip-path="url(#tile)">
    <!-- Same spiral as the sidebar/mobile mark (acoustics-logo.svg), forced white
         and zoomed to scale 1.85 about the centre so it fills the teal tile and
         reads as a solid silhouette down to 16px. -->
    <g transform="translate(24 24) scale(1.85) translate(-24 -24)">
      <path d="M 24.0 24.0 C 24.0 19.5 30.0 19.5 30.0 24.0 C 30.0 31.5 18.0 31.5 18.0 24.0 C 18.0 13.5 33.0 13.5 33.0 24.0 C 33.0 37.5 12.0 37.5 12.0 24.0 C 12.0 7.5 39.0 7.5 39.0 24.0" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3.4" fill="#ffffff"/>
    </g>
  </g>
</svg>
